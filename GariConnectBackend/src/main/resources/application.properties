# 1. URL de la base de donnees (Utilise la variable sur Render, ou localhost par defaut)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gariconnect_db}

# 2. Identifiants PostgreSQL (Utilise les variables sur Render, ou les valeurs locales par defaut)
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:gariconnect}

# 3. Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate - Gestion automatique des tables
spring.jpa.hibernate.ddl-auto=update

# Affichage des requetes SQL dans la console pour le debogage
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecte specifique a PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect