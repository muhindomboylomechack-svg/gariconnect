# 1. URL de la base de donnees
# Utilise DB_URL sur Render, ou se connecte a localhost en local si DB_URL n'existe pas
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gariconnect_db}

# 2. Identifiants PostgreSQL
# Utilise les variables de production, ou les identifiants locaux par defaut
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:gariconnect}

# 3. Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. Hibernate - Gestion des tables
# 'update' cree les tables automatiquement ou les modifie sans supprimer tes donnees
spring.jpa.hibernate.ddl-auto=update

# Affiche les requetes SQL dans la console (tres utile pour debugger)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specifie le dialecte pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect