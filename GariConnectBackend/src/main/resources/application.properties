# =========================================================================
# 1. Configuration de la base de donnees
# =========================================================================
# En local, il utilisera 123456. Sur Render, il utilisera la variable d'environnement DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gariconnect_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# =========================================================================
# 2. Driver PostgreSQL
# =========================================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# 3. Hibernate - Gestion automatique des tables
# =========================================================================
spring.jpa.hibernate.ddl-auto=update

# =========================================================================
# 4. Debugging - Affichage des requetes SQL
# =========================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================================
# 5. Dialecte PostgreSQL (Optionnel avec les versions recentes de Hibernate)
# =========================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================================================
# 6. Configuration du pool de connexions (HikariCP)
# =========================================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =========================================================================
# 7. Configuration de l'Integration de l'IA et Google Maps (Securisee)
# =========================================================================
gemini.api.key=${GEMINI_API_KEY}
gariconnect.ai.api-key=${GEMINI_API_KEY}

google.maps.api.key=${GOOGLE_MAPS_API_KEY}

# =========================================================================
# 8. Configuration du Service d'Email (JavaMailSender)
# =========================================================================
# Serveur SMTP de Google (Gmail)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

# Identifiant Gmail reel configure pour le local
spring.mail.username=${MAIL_USERNAME:muhindomboylomechack@gmail.com}

# Mot de passe d'application nettoye (16 caracteres sans les espaces pour le local)
spring.mail.password=${MAIL_PASSWORD:mimnqmpwyfqkzpxo}

# Parametres obligatoires pour la securite TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

